plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'io.freefair.lombok' version '8.10'
}

group = mod_group
base {
    archivesName = 'TinkersConstruct'
}
version = "${minecraft_version}-${mod_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    flatDir {
        dir '../Mantle-neo/build/libs'
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    // Phase 0: AT file is a placeholder (comment-only). Real entries return in Phase 1.
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll('--mod', mod_id, '--all',
                '--output', (project.findProperty('datagenOut') ?: file('src/generated/resources/').absolutePath).toString(),
                '--existing', file('src/main/resources/').absolutePath,
                '--existing-mod', 'mantle')
        }
    }

    mods {
        tconstruct {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.tconstruct
    }
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude '.cache'
            exclude 'assets/tconstruct/debug'
        }
    }
}

dependencies {
    implementation "slimeknights.mantle:Mantle:${mantle_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

// Expand mod metadata placeholders into neoforge.mods.toml and pack.mcmeta
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_license            : mod_license,
        mantle_range           : mantle_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get().asFile}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url = DEPLOY_DIR }
        }
    }
}
